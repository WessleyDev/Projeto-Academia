<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <title>Academia</title>

</head>

<body>
  <main>
    <div class="card">
      <div class="lado-direito">
        <img class="img-academia" src="./img/Imagem.png" alt="Interior da academia">
        <h1>Crie sua conta e acompanhe sua evolução diária! </h1>
        <h3>Já tem uma conta?</h3>
        <a class="botao-entrar" href="login.html">
          Entrar
          <span class="seta"></span>
        </a>
      </div>


      <div class="formulario">
        <h2 class="titulo-formulario">Cadastro</h2>

        <form class="form-acesso" action="#" method="post">

          <label for="nome">Nome:</label>
          <div class="campo-input">
            <input id="nome" name="nome" type="text" placeholder="Nome e sobrenome" required>
            <i class="fa-solid fa-user"></i>
          </div>


          <label for="email">Email:</label>
          <div class="campo-input">
            <input id="email" name="email" type="email" placeholder="Exemplo@gmail.com" required>
            <i class="fa-solid fa-envelope"></i>
          </div>

          <label for="senha">Senha:</label>
          <div class="campo-input">
            <input id="senha" name="senha" type="password" placeholder="Senha" required>
            <i class="fa-solid fa-lock"></i>
          </div>

          <button class="botao-formulario" type="submit">
            Cadastrar
          </button>
        </form>

        <div class="redes-sociais">
          <p>Ou</p>

          <div class="icones-sociais">
            <a href="#" aria-label="Google">
              <i class="fa-brands fa-google"></i>
            </a>

            <a href="#" aria-label="Facebook">
              <i class="fa-brands fa-facebook"></i>
            </a>

            <a href="#" aria-label="X">
              <i class="fa-brands fa-x-twitter"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>

</html>
